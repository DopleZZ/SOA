plugins {
    id 'org.openapi.generator' version '7.8.0' apply false
}

ext {
    springBootVersion = '2.3.12.RELEASE'
    springCloudVersion = 'Hoxton.SR12'
    springdocVersion = '1.4.8'
}

subprojects {
    apply plugin: 'java'

    group = 'ru.itmo.soa'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 11
    }

    dependencies {
        implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
    }

    ext.configureModelSpec = { task, String spec, String apiPackage, String modelPackage ->
        task.generatorName = 'jaxrs-spec'
        task.inputSpec = "${rootDir}/${spec}"
        task.templateDir = "${rootDir}/openapi-templates"
        task.apiPackage = apiPackage
        task.modelPackage = modelPackage
        task.configOptions = [
                interfaceOnly          : 'true',
                returnResponse         : 'true',
                useTags                : 'true',
                useJakartaEe           : 'false',
                useBeanValidation      : 'false',
                useSwaggerAnnotations  : 'false',
                hideGenerationTimestamp: 'true',
                sourceFolder           : 'java',
        ]
        task.typeMappings = [DateTime: 'String']
        task.importMappings = [OffsetDateTime: 'java.lang.String']
        task.generateApiDocumentation = false
        task.generateModelDocumentation = false
        task.generateApiTests = false
        task.generateModelTests = false
        task.cleanupOutput = true
    }

    tasks.register('serviceJar', Jar) {
        dependsOn tasks.named('classes')
        archiveFileName = "${project.name}.jar"
        destinationDirectory = layout.buildDirectory.dir('dist')
        manifest {
            attributes(
                    'Implementation-Title': project.name,
                    'Implementation-Version': project.version,
                    'Class-Path': configurations.runtimeClasspath.collect { "libs/${it.name}" }.join(' ')
            )
        }
        from sourceSets.main.output
    }

    tasks.register('copyLibs', Copy) {
        from configurations.runtimeClasspath
        into layout.buildDirectory.dir('dist/libs')
    }

    tasks.named('assemble') {
        dependsOn tasks.named('serviceJar'), tasks.named('copyLibs')
    }
}

subprojects {
    afterEvaluate {
        tasks.named('serviceJar') {
            manifest {
                attributes('Main-Class': project.ext.mainClass)
            }
        }
    }
}
