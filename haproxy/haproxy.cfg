resolvers docker
    nameserver local 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold obsolete 10s

global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend shop_frontend
    bind *:8090
    default_backend shop_backends

backend shop_backends
    balance roundrobin
    option redispatch
    retries 3
    option httpchk HEAD /shop/search/by-type/PLANE
    http-check expect status 200
    server shop-wildfly wildfly-shop:8080 check inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server shop-jar shop-2:19402 check inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
