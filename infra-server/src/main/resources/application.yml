server:
  port: ${SERVER_PORT:19100}
  tomcat:
    threads:
      max: 10
      min-spare: 2
  ssl:
    enabled: ${INFRA_SSL_ENABLED:false}
    key-store: ${INFRA_SSL_KEYSTORE:}
    key-store-password: ${INFRA_SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: JKS
    key-alias: gateway

spring:
  application:
    name: infra-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          search-locations: file:${CONFIG_REPO_DIR:${user.dir}/config-repo}

zuul:
  ignored-services: '*'
  routes:
    vehicles:
      path: /api/vehicles/**
      service-id: vehicle-service
      strip-prefix: false
    shop:
      path: /shop/**
      url: ${SHOP_ROUTE_URL:http://localhost:19290}
      strip-prefix: false
  host:
    connect-timeout-millis: 3000
    socket-timeout-millis: 10000
    max-total-connections: 20
    max-per-route-connections: 10

vehicle-service:
  ribbon:
    ReadTimeout: 8000
    ConnectTimeout: 2000
    MaxAutoRetries: 0
    MaxAutoRetriesNextServer: 1
    OkToRetryOnAllOperations: false
    ServerListRefreshInterval: 2000

ribbon:
  eager-load:
    enabled: true
    clients: vehicle-service

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: https://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
