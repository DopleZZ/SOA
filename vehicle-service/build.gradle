def generatedDir = layout.buildDirectory.dir('generated/openapi')

openApiGenerate {
    configureJaxrsSpec(delegate, 'vehicle-service.yaml', 'ru.itmo.soa.vehicle.api', 'ru.itmo.soa.vehicle.model')
    outputDir = generatedDir.get().asFile.path
    globalProperties = [apis: '', models: '']
}

dependencies {
    providedCompile 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    providedCompile 'jakarta.transaction:jakarta.transaction-api:2.0.1'
    providedCompile 'jakarta.inject:jakarta.inject-api:2.0.1'
    implementation 'cz.jirutka.rsql:rsql-parser:2.1.0'
}

sourceSets.main.java.srcDir(generatedDir.map { it.dir('java') })
