openapi: 3.0.3
info:
  title: Shop Service
  description: >
    Дополнительный сервис, реализующий операции поиска транспортных средств,
    делегируя обращения к API первого сервиса (vehicle-service). Все операции
    возвращают данные в формате XML.
  version: "1.0.0"
  license:
    name: Proprietary

servers:
  - url: "{scheme}://{host}:{port}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost
      port:
        default: "8081"

security: []

tags:
  - name: Shop
    description: операции поиска по коллекции Vehicle через vehicle-service

paths:
  /shop/search/by-type/{type}:
    get:
      tags: [Shop]
      operationId: searchByType
      summary: Найти все транспортные средства заданного типа
      description: >
        Возвращает массив всех транспортных средств, у которых поле type
        равно переданному значению. Обращение проксируется в vehicle-service.
      parameters:
        - $ref: '#/components/parameters/VehicleTypePath'
      responses:
        '200':
          description: Массив транспортных средств заданного типа
          content:
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'

  /shop/search/by-engine-power/{from}/{to}:
    get:
      tags: [Shop]
      operationId: searchByEnginePowerRange
      summary: Найти все транспортные средства с мощностью двигателя в заданном диапазоне
      description: >
        Возвращает массив всех транспортных средств, у которых значение
        enginePower находится в диапазоне [from, to] включительно.
        Обращение проксируется в vehicle-service.
      parameters:
        - $ref: '#/components/parameters/EnginePowerFrom'
        - $ref: '#/components/parameters/EnginePowerTo'
      responses:
        '200':
          description: Массив транспортных средств в диапазоне мощности
          content:
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    VehicleTypePath:
      name: type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/VehicleType'

    EnginePowerFrom:
      name: from
      in: path
      required: true
      description: Нижняя граница диапазона мощности (включительно)
      schema:
        type: number
        format: double
        minimum: 0

    EnginePowerTo:
      name: to
      in: path
      required: true
      description: Верхняя граница диапазона мощности (включительно)
      schema:
        type: number
        format: double
        minimum: 0

  responses:
    BadRequest:
      description: Неверные параметры запроса
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    VehicleType:
      type: string
      enum: [PLANE, HELICOPTER, SPACESHIP]
      xml:
        name: VehicleType

    Coordinates:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: integer
          format: int64
          exclusiveMinimum: true
          minimum: -575
      xml:
        name: Coordinates

    Vehicle:
      type: object
      required: [id, name, coordinates, creationDate, enginePower, type, fuelType]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        name:
          type: string
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creationDate:
          type: string
          format: date-time
          readOnly: true
        enginePower:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
        type:
          $ref: '#/components/schemas/VehicleType'
        fuelType:
          $ref: '#/components/schemas/FuelType'
      xml:
        name: Vehicle

    FuelType:
      type: string
      enum: [ELECTRICITY, MANPOWER, ANTIMATTER]
      xml:
        name: FuelType

    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
      xml:
        name: Error